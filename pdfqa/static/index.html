<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>PDF Q&amp;A Bot</title>
<style>
  :root {
    --bg: #f3f4f6; --panel: #fff; --sunken: #f7f8fa; --line: #e2e5ea; --line-strong: #cdd2da;
    --text: #151922; --text-2: #434b5c; --muted: #646c7e;
    --accent: #2c4bd4; --accent-hover: #2340bd; --accent-weak: #edf0fc;
    --ok: #1d7347; --ok-weak: #e7f3ec; --bad: #b93636; --bad-weak: #fbeceb; --warn: #8a5a00; --warn-weak: #fcf2df;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
    --radius: 10px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1014; --panel: #161920; --sunken: #1b1f27; --line: #262b35; --line-strong: #353c48;
      --text: #e8ebf1; --text-2: #bcc2ce; --muted: #8f97a8;
      --accent: #8fa3ff; --accent-hover: #a7b6ff; --accent-weak: #1d2442;
      --ok: #5cc28d; --ok-weak: #13271d; --bad: #f08585; --bad-weak: #2e1819; --warn: #e2b456; --warn-weak: #2c2412;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 15px/1.55 var(--font); background: var(--bg); color: var(--text);
         -webkit-font-smoothing: antialiased; }
  button, input, textarea { font: inherit; color: inherit; }
  svg { flex: none; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* --- layout ---------------------------------------------------------------------------- */
  .app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
  .body { display: grid; grid-template-columns: 300px 1fr; min-height: 0; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: var(--panel);
           border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand h1 { font-size: 16px; font-weight: 650; margin: 0; letter-spacing: -.01em; white-space: nowrap; }
  .brand p { margin: 0; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff;
          display: grid; place-items: center; }
  .status { margin-left: auto; display: flex; gap: 14px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .status span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); }
  .dot.on { background: var(--ok); }

  /* --- documents ------------------------------------------------------------------------- */
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 18px 16px; overflow-y: auto;
          display: flex; flex-direction: column; gap: 14px; }
  .section-title { display: flex; align-items: baseline; justify-content: space-between; }
  .section-title h2 { font-size: 13px; font-weight: 600; margin: 0; color: var(--text-2); }
  .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .drop { border: 1px dashed var(--line-strong); border-radius: var(--radius); padding: 18px 12px; text-align: center;
          color: var(--muted); font-size: 13px; cursor: pointer; background: var(--sunken);
          transition: border-color .15s, background-color .15s; }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-weak); }
  .drop strong { display: block; color: var(--text); font-weight: 600; font-size: 14px; margin: 6px 0 2px; }
  .drop .choose { color: var(--accent); }
  .drop svg { color: var(--muted); }
  .note { font-size: 13px; color: var(--muted); min-height: 0; }
  .note.error { color: var(--bad); }
  .files { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .file { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 8px;
          border-radius: 8px; }
  .file:hover { background: var(--sunken); }
  .file .icon { color: var(--muted); }
  .file a { display: block; color: var(--text); text-decoration: none; font-weight: 500; font-size: 14px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file a:hover { color: var(--accent); }
  .file small { display: block; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .icon-button { border: 0; background: none; padding: 6px; border-radius: 6px; color: var(--muted); cursor: pointer;
                 display: grid; place-items: center; opacity: 0; }
  .file:hover .icon-button, .icon-button:focus-visible { opacity: 1; }
  .icon-button:hover { color: var(--bad); background: var(--bad-weak); }
  .text-button { border: 0; background: none; padding: 0; color: var(--muted); font-size: 13px; cursor: pointer;
                 align-self: flex-start; }
  .text-button:hover { color: var(--bad); text-decoration: underline; }
  @media (hover: none) { .icon-button { opacity: 1; } }

  /* --- conversation ---------------------------------------------------------------------- */
  main { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
  .scroll { overflow-y: auto; padding: 28px 24px 12px; }
  .column { max-width: 760px; margin: 0 auto; }
  .empty { padding: 56px 0 24px; max-width: 520px; }
  .empty h2 { font-size: 22px; font-weight: 650; letter-spacing: -.015em; margin: 0 0 8px; }
  .empty p { color: var(--text-2); margin: 0 0 20px; }
  .examples { display: grid; gap: 8px; }
  .example { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 8px;
             padding: 10px 14px; cursor: pointer; color: var(--text-2); box-shadow: var(--shadow);
             display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .example:hover { border-color: var(--accent); color: var(--text); }
  .example svg { color: var(--muted); }
  .turn { margin-bottom: 28px; }
  .question { margin: 0 0 10px auto; width: fit-content; max-width: 85%; background: var(--accent-weak);
              color: var(--text); padding: 9px 14px; border-radius: 14px 14px 4px 14px; white-space: pre-wrap; }
  .answer { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
            box-shadow: var(--shadow); padding: 16px 18px; }
  .a { white-space: pre-wrap; }
  .a sup a { color: var(--accent); font-weight: 600; font-size: 11px; text-decoration: none; padding: 0 1px; }
  .a sup a:hover { text-decoration: underline; }
  .pending { color: var(--muted); }
  mark { background: none; color: inherit; border-bottom: 2px solid; padding: 0 1px; border-radius: 2px; cursor: help; }
  mark.supported, mark.derived { border-color: var(--ok); }
  mark.derived { border-bottom-style: dashed; }
  mark.unsupported, mark.unit_mismatch, mark.wrong_citation { border-color: var(--bad); background: var(--bad-weak); }
  mark:hover, mark:focus-visible { background: var(--ok-weak); outline: 0; }
  mark.unsupported:hover, mark.unit_mismatch:hover, mark.wrong_citation:hover,
  mark.unsupported:focus-visible, mark.unit_mismatch:focus-visible, mark.wrong_citation:focus-visible { background: var(--bad-weak); }

  .verdict { display: flex; align-items: flex-start; gap: 8px; margin-top: 14px; padding: 8px 12px; border-radius: 8px;
             font-size: 13px; font-weight: 500; }
  .verdict.ok { background: var(--ok-weak); color: var(--ok); }
  .verdict.fixed { background: var(--warn-weak); color: var(--warn); }
  .verdict.bad { background: var(--bad-weak); color: var(--bad); }
  .verdict.none { background: var(--sunken); color: var(--muted); font-weight: 400; }
  .verdict svg { margin-top: 2px; }
  .verdict p { margin: 0; }
  .verdict span { color: var(--text-2); font-weight: 400; }

  .sources { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 4px; }
  .sources-title { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 2px; }
  details.src { border-radius: 8px; }
  details.src[open] { background: var(--sunken); }
  .src summary { list-style: none; display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 10px;
                 padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .src summary::-webkit-details-marker { display: none; }
  .src summary:hover { background: var(--sunken); }
  .src .n { min-width: 22px; height: 22px; border-radius: 6px; background: var(--accent-weak); color: var(--accent);
            font-size: 12px; font-weight: 600; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
  .src .name { color: var(--text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .src .name em { font-style: normal; color: var(--muted); font-weight: 400; }
  .src .open { color: var(--muted); display: grid; place-items: center; padding: 2px; border-radius: 4px; }
  .src .open:hover { color: var(--accent); }
  .src .chev { color: var(--muted); transition: transform .15s; }
  .src[open] .chev { transform: rotate(90deg); }
  .src blockquote { margin: 0; padding: 4px 12px 12px 40px; font-size: 13px; color: var(--text-2); line-height: 1.6; }
  .src blockquote .evidence { background: var(--ok-weak); color: var(--text); border-radius: 3px; padding: 1px 2px;
                              box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .src.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { from { box-shadow: 0 0 0 2px var(--accent); } to { box-shadow: 0 0 0 2px transparent; } }

  .tip { position: fixed; z-index: 10; max-width: 340px; background: var(--panel); color: var(--text);
         border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.5;
         box-shadow: 0 8px 24px rgba(16, 24, 40, .14), 0 2px 6px rgba(16, 24, 40, .08); pointer-events: none; }
  .tip[hidden] { display: none; }
  .tip + .tip { margin-top: 8px; }
  .tip .t { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .tip .t.ok { color: var(--ok); }
  .tip .t.bad { color: var(--bad); }
  .tip q { display: block; margin-top: 4px; color: var(--text-2); }
  .tip q::before, .tip q::after { content: none; }
  .tip small { display: block; margin-top: 6px; color: var(--muted); }
  .tip hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }

  .composer { padding: 12px 24px 18px; background: var(--bg); }
  .composer form { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end;
                   background: var(--panel); border: 1px solid var(--line-strong); border-radius: 12px;
                   padding: 8px 8px 8px 14px; box-shadow: var(--shadow); }
  .composer form:focus-within { border-color: var(--accent); }
  textarea, textarea:focus-visible { flex: 1; border: 0; outline: 0; resize: none; background: none; padding: 6px 0; max-height: 160px;
             line-height: 1.5; }
  textarea::placeholder { color: var(--muted); }
  .primary { border: 0; border-radius: 8px; background: var(--accent); color: #fff; padding: 8px 16px;
             font-weight: 600; cursor: pointer; }
  @media (prefers-color-scheme: dark) { .primary { color: #0e1014; } }
  .primary:hover { background: var(--accent-hover); }
  .primary:disabled { opacity: .5; cursor: default; }
  .hint { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--muted); }

  @media (max-width: 820px) {
    .app, .body { display: block; height: auto; }
    header { flex-wrap: wrap; row-gap: 6px; }
    .status { margin-left: 0; width: 100%; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
    main { display: block; }
    .scroll { padding: 20px 16px 8px; }
    .composer { position: sticky; bottom: 0; padding: 10px 12px 14px; }
    .empty { padding-top: 16px; }
    .brand p { white-space: normal; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="m9 14 2 2 4-4"/></svg>
      </div>
      <div>
        <h1>PDF Q&amp;A Bot</h1>
        <p>Answers from your PDFs, with the page they came from and every number checked.</p>
      </div>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
  </header>

  <div class="body">
    <aside aria-label="Documents">
      <div class="section-title"><h2>Documents</h2><span class="count" id="doc-count"></span></div>
      <div class="drop" id="drop" role="button" tabindex="0" aria-label="Upload PDFs">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4"/><path d="m7 9 5-5 5 5"/><path d="M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg>
        <strong>Drop PDFs here</strong>
        or <span class="choose">choose files</span>
        <input id="file" type="file" accept="application/pdf" multiple hidden>
      </div>
      <div class="note" id="upload-status" aria-live="polite"></div>
      <ul class="files" id="files"></ul>
      <button class="text-button" id="reset" hidden>Remove all documents</button>
    </aside>

    <main>
      <div class="scroll" id="scroll">
        <div class="column">
          <div class="empty" id="empty"></div>
          <div id="log"></div>
        </div>
      </div>
      <div class="composer">
        <form id="ask">
          <label class="visually-hidden" for="question">Question</label>
          <textarea id="question" rows="1" placeholder="Ask something about your documents" autocomplete="off"></textarea>
          <button class="primary" id="send">Ask</button>
        </form>
        <div class="hint">Enter to send, Shift+Enter for a new line.</div>
      </div>
    </main>
  </div>
</div>
<div class="tip" id="tip" role="tooltip" hidden></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

const ICON_FILE = `<svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>`;
const ICON_X = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>`;
const ICON_ARROW = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>`;

// Example questions for the sample PDFs in examples/, shown only when those files are indexed.
const EXAMPLES = {
  "employee-handbook.pdf": ["How many vacation days do full-time employees get?", "What is the hotel limit in Paris?"],
  "espresso-manual.pdf": ["What does error E03 mean?"],
};

// When the server sets API_TOKEN, ask for it once and keep it in this browser.
async function api(path, options = {}) {
  const token = localStorage.getItem("pdfqa-token");
  const headers = { ...(options.headers || {}), ...(token ? { Authorization: `Bearer ${token}` } : {}) };
  const res = await fetch(path, { ...options, headers });
  if (res.status === 401) {
    const entered = prompt("This server needs an access token:");
    if (entered) { localStorage.setItem("pdfqa-token", entered.trim()); return api(path, options); }
  }
  return res;
}

let documents = [];

async function refresh() {
  const [docs, health] = await Promise.all([api("/documents").then(r => r.json()), fetch("/health").then(r => r.json())]);
  const files = docs.files || (docs.documents || []).map(name => ({ name }));
  documents = files.map(f => f.name);
  $("files").innerHTML = files.map(f => `
    <li class="file">
      ${ICON_FILE}
      <div style="min-width:0">
        <a data-doc="${esc(f.name)}" href="/documents/${encodeURIComponent(f.name)}" target="_blank" title="${esc(f.name)}">${esc(f.name)}</a>
        ${f.pages ? `<small>${plural(f.pages, "page")} · ${plural(f.chunks, "chunk")}</small>` : ""}
      </div>
      <button class="icon-button" data-remove="${esc(f.name)}" aria-label="Remove ${esc(f.name)}" title="Remove">${ICON_X}</button>
    </li>`).join("");
  $("doc-count").textContent = files.length ? files.length : "";
  $("reset").hidden = !files.length;
  const llm = health.llm.startsWith("none") ? "No LLM, extractive answers" : `Model: ${health.llm}`;
  $("status").innerHTML = `<span><i class="dot ${files.length ? "on" : ""}"></i>${plural(health.chunks, "chunk")} indexed</span><span>${esc(llm)}</span>`;
  $("send").disabled = !files.length;
  renderEmpty();
}

function renderEmpty() {
  const empty = $("empty");
  empty.hidden = $("log").children.length > 0;
  if (!documents.length) {
    empty.innerHTML = `<h2>Upload a PDF to start</h2>
      <p>Answers cite the page they come from, and every amount, date and quote in them is checked against that page.</p>`;
    return;
  }
  const examples = documents.flatMap(d => EXAMPLES[d] || []).slice(0, 3);
  empty.innerHTML = `<h2>Ask about your documents</h2>
    <p>Answers cite the page they come from, and every amount, date and quote in them is checked against that page.</p>
    ${examples.length ? `<div class="examples">${examples.map(q =>
      `<button class="example" data-question="${esc(q)}"><span>${esc(q)}</span>${ICON_ARROW}</button>`).join("")}</div>` : ""}`;
}

async function upload(files) {
  if (!files.length) return;
  const body = new FormData();
  [...files].forEach(f => body.append("files", f));
  const note = $("upload-status");
  note.className = "note";
  note.textContent = `Indexing ${plural(files.length, "file")}…`;
  const res = await api("/documents", { method: "POST", body });
  const data = await res.json();
  if (res.ok) {
    note.textContent = "";
  } else {
    note.className = "note error";
    note.textContent = data.detail;
  }
  refresh();
}

const drop = $("drop");
drop.onclick = () => $("file").click();
drop.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").click(); } };
$("file").onchange = (e) => { upload(e.target.files); e.target.value = ""; };
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); upload(e.dataTransfer.files); };
$("files").onclick = async (e) => {
  const button = e.target.closest("[data-remove]");
  if (!button) return;
  await api(`/documents/${encodeURIComponent(button.dataset.remove)}`, { method: "DELETE" });
  refresh();
};

// Links open /documents/<name>#page=N directly. With API_TOKEN set, a plain link can't send the
// header, so fetch the PDF with it and open a blob URL instead.
document.addEventListener("click", async (e) => {
  const link = e.target.closest("a[data-doc]");
  if (!link || !localStorage.getItem("pdfqa-token")) return;
  e.preventDefault();
  const res = await api(link.pathname);
  if (res.ok) window.open(`${URL.createObjectURL(await res.blob())}${link.hash}`, "_blank");
});
$("reset").onclick = async () => { await api("/documents", { method: "DELETE" }); $("log").innerHTML = ""; refresh(); };
$("empty").onclick = (e) => {
  const example = e.target.closest("[data-question]");
  if (example) ask(example.dataset.question);
};

// Citation markers link to the source card of the same turn.
const cite = (text, turn) => esc(text).replace(/\[(\d+)\]/g, `<sup><a href="#src-${turn}-$1" data-src="${turn}-$1">[$1]</a></sup>`);

const ICON_OK = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>`;
const ICON_ALERT = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>`;
const ICON_INFO = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>`;
const ICON_OPEN = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4"/></svg>`;
const ICON_CHEV = `<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>`;

// What the check found for one value, shown when hovering or focusing it.
const OK = ["supported", "derived"];
const TITLES = {
  supported: "Matches the source", derived: "Calculated from the source", unsupported: "Not in the cited source",
  unit_mismatch: "Different unit in the source", wrong_citation: "In a different source",
};
function tipHtml(c, sources) {
  const source = sources.find(s => s.n === c.source);
  let body = "";
  if (c.status === "unsupported") body = "No excerpt the answer cites contains this value.";
  else if (c.evidence === "given in the question") body = "You wrote this value in the question.";
  else if (c.evidence) body = c.evidence;
  const where = source ? `[${source.n}] ${source.citation}` : "";
  const kind = OK.includes(c.status) ? "ok" : "bad";
  return `<div class="t ${kind}">${kind === "ok" ? ICON_OK : ICON_ALERT}${TITLES[c.status]}</div>` +
    (body ? `<q>${esc(body)}</q>` : "") + (where ? `<small>${esc(where)}</small>` : "");
}

// Underline each checked value: green if an excerpt backs it, red if not.
const WORST = ["supported", "derived", "wrong_citation", "unit_mismatch", "unsupported"];
function annotate(text, checks, sources, turn) {
  // both ends of a range ("4 to 6 weeks") share one span: show the worse status, both results
  const spans = new Map();
  for (const c of checks) {
    const key = `${c.start}:${c.end}`;
    spans.set(key, [...(spans.get(key) || []), c]);
  }
  // the server counts code points, JavaScript strings count UTF-16 units: slice by code point
  const chars = Array.from(text);
  const part = (a, b) => chars.slice(a, b).join("");
  let html = "", at = 0;
  for (const group of [...spans.values()].sort((a, b) => a[0].start - b[0].start)) {
    const { start, end } = group[0];
    if (start < at) continue;
    const status = group.map(c => c.status).sort((a, b) => WORST.indexOf(b) - WORST.indexOf(a))[0];
    const tip = group.map(c => tipHtml(c, sources)).join("<hr>");
    const label = group.map(c => TITLES[c.status]).join(", ");
    html += cite(part(at, start), turn);
    html += `<mark class="${status}" tabindex="0" aria-label="${esc(part(start, end))}: ${esc(label)}" data-tip="${esc(tip)}">${esc(part(start, end))}</mark>`;
    at = end;
  }
  return html + cite(part(at), turn);
}

function verdict(data) {
  if (!data.sources.length) return "";
  const n = data.checks.length;
  if (!n) return `<div class="verdict none">${ICON_INFO}<p>No amounts, dates or quotes in this answer to check.</p></div>`;
  const bad = data.checks.filter(c => !OK.includes(c.status)).length;
  if (bad) return `<div class="verdict bad">${ICON_ALERT}<p>${bad} of ${plural(n, "value")} not found in the sources <span>· marked in red</span></p></div>`;
  if (data.repaired) return `<div class="verdict fixed">${ICON_OK}<p>${plural(n, "value")} checked <span>· the first draft had values the sources don't back and was corrected</span></p></div>`;
  return `<div class="verdict ok">${ICON_OK}<p>${plural(n, "value")} checked against the sources <span>· hover or tap a value to see where it comes from</span></p></div>`;
}

// One collapsible card per cited excerpt. The sentences the check matched are highlighted.
function sourceHtml(s, checks, turn) {
  const quotes = [...new Set(checks.filter(c => c.source === s.n && c.evidence && s.text.includes(c.evidence)).map(c => c.evidence))];
  let text = esc(s.text);
  for (const q of quotes) text = text.split(esc(q)).join(`<span class="evidence">${esc(q)}</span>`);
  const [file, page] = [s.doc || s.citation, s.page ? `p. ${s.page}` : ""];
  return `<details class="src" id="src-${turn}-${s.n}">
    <summary><span class="n">${s.n}</span><span class="name">${esc(file)} <em>${page}</em></span>
      <a class="open" data-doc="${esc(s.doc)}" href="/documents/${encodeURIComponent(s.doc)}#page=${s.page}" target="_blank" aria-label="Open ${esc(file)} at ${page}" title="Open the PDF at this page">${ICON_OPEN}</a>${ICON_CHEV}</summary>
    <blockquote>${text}</blockquote>
  </details>`;
}

// One tooltip element, moved to the value under the pointer or keyboard focus.
const tip = $("tip");
function showTip(mark) {
  tip.innerHTML = mark.dataset.tip;
  tip.hidden = false;
  const r = mark.getBoundingClientRect(), t = tip.getBoundingClientRect();
  const left = Math.min(Math.max(8, r.left + r.width / 2 - t.width / 2), innerWidth - t.width - 8);
  const top = r.top - t.height - 8 > 8 ? r.top - t.height - 8 : r.bottom + 8;
  tip.style.left = `${left}px`;
  tip.style.top = `${top}px`;
}
const hideTip = () => { tip.hidden = true; };
for (const [type, show] of [["mouseover", true], ["focusin", true], ["mouseout", false], ["focusout", false]]) {
  document.addEventListener(type, (e) => {
    const mark = e.target.closest && e.target.closest("mark[data-tip]");
    if (mark) show ? showTip(mark) : hideTip();
  });
}
$("scroll").addEventListener("scroll", hideTip);

// A citation marker opens its source card.
document.addEventListener("click", (e) => {
  const link = e.target.closest("a[data-src]");
  if (!link) return;
  e.preventDefault();
  const card = $(`src-${link.dataset.src}`);
  if (!card) return;
  card.open = true;
  card.scrollIntoView({ block: "nearest", behavior: "smooth" });
  card.classList.remove("flash");
  void card.offsetWidth;
  card.classList.add("flash");
});

// Reads the server-sent events from /ask/stream: "token" pieces, then "done" with the final answer.
async function* readEvents(res) {
  const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
  let buffer = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) return;
    buffer += value;
    let end;
    while ((end = buffer.indexOf("\n\n")) >= 0) {
      const [kind, data] = buffer.slice(0, end).split("\n");
      buffer = buffer.slice(end + 2);
      yield [kind.slice(7), JSON.parse(data.slice(6))];
    }
  }
}

const scrollDown = () => { const s = $("scroll"); s.scrollTop = s.scrollHeight; };

let turns = 0;
async function ask(question) {
  question = question.trim();
  if (!question || $("send").disabled) return;
  $("send").disabled = true;
  const id = ++turns;
  $("log").insertAdjacentHTML("beforeend", `<div class="turn"><div class="question">${esc(question)}</div>
    <div class="answer"><div class="a pending">Searching the documents…</div></div></div>`);
  renderEmpty();
  const turn = $("log").lastElementChild;
  const show = (html) => { const a = turn.querySelector(".a"); a.classList.remove("pending"); a.innerHTML = html; };
  scrollDown();
  try {
    const res = await api("/ask/stream", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question }) });
    if (!res.ok) { show(esc((await res.json()).detail)); return; }
    let text = "";
    for await (const [kind, data] of readEvents(res)) {
      if (kind === "token") show(cite(text += data, id));
      if (kind === "error") show(esc(data));
      if (kind === "done") {
        show(annotate(data.answer, data.checks, data.sources, id));
        turn.querySelector(".answer").insertAdjacentHTML("beforeend", verdict(data) + (data.sources.length
          ? `<div class="sources"><div class="sources-title">Sources</div>${data.sources.map(s => sourceHtml(s, data.checks, id)).join("")}</div>`
          : ""));
      }
      scrollDown();
    }
  } catch (err) {
    show("Connection lost. Please try again.");
  } finally {
    $("send").disabled = !documents.length;
  }
}

const input = $("question");
input.oninput = () => { input.style.height = "auto"; input.style.height = `${input.scrollHeight}px`; };
input.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("ask").requestSubmit(); } };
$("ask").onsubmit = (e) => {
  e.preventDefault();
  const question = input.value;
  input.value = "";
  input.oninput();
  ask(question);
};

refresh();
</script>
</body>
</html>
